version: "3.9"
services:
  postgres:
    image: postgres:9.6
    environment:
      - POSTGRES_USER=allocation
      - POSTGRES_PASSWORD=abc123
    ports:
      - "54322:5432"

  api:
    build: .
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - FLASK_APP=entrypoints.flask_app
    ports:
      - "5005:80"
